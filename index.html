<meta lang="en" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="peersky://static/assets/upload.ico" />
<title>Hyperdrive</title>
<style>
  @import url("browser://theme/index.css");
  html {
    background: var(--browser-theme-background);
    color: var(--browser-theme-text-color);
    font-family: var(--browser-theme-font-family);
  }
  #uploadBox {
    padding: 1em;
    border: 2px dashed #404950;
    border-radius: 0.5em;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #uploadBox svg {
    color: var(--peersky-nav-button-color);
    width: 100px;
    height: 100px;
  }

  #pickerActions {
    display: flex;
    gap: 0.75em;
    justify-content: center;
    margin-top: 0.75em;
  }
  #protocolSelect {
    margin-bottom: 20px;
  }

  #visibilityControl {
    margin-left: 1em;
  }

  #visibilityHelp {
    display: block;
    margin: 0 0 1em;
    opacity: 0.75;
  }

  [hidden] {
    display: none !important;
  }

  a {
    color: var(--browser-theme-text-color);
    padding: 0.15em 0.5em;
    border-radius: 0.5em;
  }

  main {
    margin: 1em;
  }
  #uploadListBox li.uploading {
    font-style: italic;
    color: var(--browser-theme-text-color);
  }
</style>
<main>
  <label for="protocolSelect">
    Protocol:
    <select id="protocolSelect">
      <option value="hyper" selected>hyper://</option>
      <option value="ipfs">ipfs://</option>
    </select>
  </label>
  <label id="visibilityControl" for="visibilitySelect">
    Visibility:
    <select id="visibilitySelect">
      <option value="public" selected>Public</option>
      <option value="private">Private</option>
    </select>
  </label>
  <small id="visibilityHelp">Public uploads are announced and can be shared with a Hyper URL.</small>
  <input type="file" id="fileInput" multiple style="display: none;" />
  <input type="file" id="folderInput" multiple webkitdirectory directory style="display: none;" />
  <section id="uploadBox">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-upload" viewBox="0 0 16 16">
      <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"/>
      <path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708z"/>
    </svg>  
  </section>
  <div id="pickerActions">
    <button id="chooseFiles" type="button">Choose files</button>
    <button id="chooseFolder" type="button">Choose folder</button>
  </div>
  <ul id="uploadListBox"></ul>
</main>
<script>
  function $(query) {
      return document.querySelector(query);
  }
  
  const uploadBox = $('#uploadBox');
  const fileInput = $('#fileInput');
  const folderInput = $('#folderInput');
  const uploadListBox = $('#uploadListBox');
  const protocolSelect = $('#protocolSelect');
  const visibilityControl = $('#visibilityControl');
  const visibilitySelect = $('#visibilitySelect');
  const visibilityHelp = $('#visibilityHelp');

  function updateVisibilityControl() {
      const usesHyper = protocolSelect.value === 'hyper';
      visibilityControl.hidden = !usesHyper;
      visibilityHelp.hidden = !usesHyper;
      visibilityHelp.textContent = visibilitySelect.value === 'private'
          ? 'Private uploads remain unannounced on this device. They are not encrypted.'
          : 'Public uploads are announced and can be shared with a Hyper URL.';
  }

  protocolSelect.onchange = updateVisibilityControl;
  visibilitySelect.onchange = updateVisibilityControl;
  updateVisibilityControl();
  
  // A dropped folder shows up in dataTransfer.files as an entry that cannot be
  // read, so reading it fails with EISDIR. Walk the item entries instead and
  // collect the real files, carrying the path each one had inside the folder.
  async function filesFromDataTransfer(dataTransfer) {
      const entries = Array.from(dataTransfer.items || [])
          .map((item) => (item.webkitGetAsEntry ? item.webkitGetAsEntry() : null))
          .filter(Boolean);

      if (!entries.length) return Array.from(dataTransfer.files || []);

      const files = [];

      const visit = (entry, prefix) => new Promise((resolve) => {
          if (entry.isFile) {
              entry.file((file) => {
                  file.relativePath = prefix + entry.name;
                  files.push(file);
                  resolve();
              }, () => resolve());
              return;
          }

          if (!entry.isDirectory) return resolve();

          // readEntries yields at most 100 entries per call, so keep reading
          // until it returns an empty batch.
          const reader = entry.createReader();
          const readBatch = () => reader.readEntries(async (batch) => {
              if (!batch.length) return resolve();
              await Promise.all(batch.map((child) => visit(child, prefix + entry.name + '/')));
              readBatch();
          }, () => resolve());
          readBatch();
      });

      await Promise.all(entries.map((entry) => visit(entry, '')));
      return files;
  }

  // Enable drag-and-drop for files and folders alike
  uploadBox.ondragover = (e) => { e.preventDefault(); return false; };
  uploadBox.ondrop = async (e) => {
      e.preventDefault();
      const { dataTransfer } = e;
      if (!dataTransfer) return;
      const files = await filesFromDataTransfer(dataTransfer);
      if (!files.length) return;
      await uploadFiles(files);
  };
  
  // Enable click to open file selector
  uploadBox.onclick = () => {
      fileInput.click();
  };

  $('#chooseFiles').onclick = () => fileInput.click();
  $('#chooseFolder').onclick = () => folderInput.click();
  
  // Handle file selection
  for (const input of [fileInput, folderInput]) {
      input.onchange = async () => {
          if (input.files.length > 0) {
              await uploadFiles(input.files);
              input.value = ''; // Allow selecting the same file or folder again
          }
      }
  }
  
  async function uploadFiles(files) {
      const uploadingItem = document.createElement('li');
      uploadingItem.className = 'uploading';
      uploadingItem.textContent = 'Uploading...';
      uploadListBox.appendChild(uploadingItem);
      
      const protocol = protocolSelect.value;
  
      if (protocol === 'hyper') {
          const visibility = visibilitySelect.value;
          let name = 'untitled'; // Default name if we can't determine one
          if (files.length > 0) {
              const file = files[0];
              const firstPath = file.relativePath || file.webkitRelativePath;
              if (firstPath && firstPath.includes('/')) {
                  name = firstPath.split('/')[0] || file.name;
              } else {
                  name = file.name;
              }
          }
          let hyperdriveUrl;
          try {
              hyperdriveUrl = await generateHyperdriveKey(name, visibility);
          } catch (error) {
              addError(name, error.message);
              uploadingItem.remove();
              return;
          }
          for (const file of files) {
              const filePath = file.relativePath || file.webkitRelativePath || file.name;
              const url = hyperdriveUrl + filePath.split('/').map(encodeURIComponent).join('/');

              try {
                  const buffer = await file.arrayBuffer();
                  const response = await fetch(url, {
                      method: 'PUT',
                      body: new Uint8Array(buffer),
                      headers: {
                          'Content-Type': 'application/octet-stream'
                      }
                  });
  
                  console.log(`Response for ${file.name}: ${response.status}, ok: ${response.ok}`);
                  if (!response.ok) {
                      const errorText = await response.text();
                      console.error(`Error uploading ${file.name}: ${errorText}`);
                      addError(file.name, errorText);
                      continue;
                  }
  
                  addURL(url, { name: filePath, visibility });
              } catch (error) {
                  console.error(`Error uploading ${file.name}:`, error);
                  addError(file.name, error.message);
              }
          }
      } else {
          const formData = new FormData();
          for (const file of files) {
              // Preserve folder structure for directory uploads, whether the
              // folder came from the picker or from a drop.
              const filePath = file.relativePath || file.webkitRelativePath || file.name;
              console.log(`Appending file for IPFS: ${filePath}`);
              formData.append('file', file, filePath);
          }
          const url = `ipfs://bafyaabakaieac/`;
          console.log(`Sending to IPFS: ${url}`);
  
          try {
              const response = await fetch(url, {
                  method: 'PUT',
                  body: formData,
              });
              console.log(`IPFS Response: ${response.status}`);
              if (!response.ok) {
                  addError(files[0].name, await response.text());
                  return;
              }
              const locationHeader = response.headers.get('Location');
              addURL(locationHeader);
          } catch (error) {
              console.error(`Error uploading to IPFS:`, error);
              addError(files[0].name, error.message);
          }
      }
      uploadingItem.remove();
  }
  
  async function generateHyperdriveKey(name, visibility) {
      try {
          const params = new URLSearchParams({ key: name, visibility });
          const response = await fetch(`hyper://localhost/?${params}`, { method: 'POST' });
          if (!response.ok) {
              throw new Error(`Failed to generate Hyperdrive key: ${response.statusText}`);
          }
          return await response.text();
      } catch (error) {
          console.error('Error generating Hyperdrive key:', error);
          throw error;
      }
  }
  
  function addURL(url, { name, visibility } = {}) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = visibility === 'private'
          ? `Open ${name || 'private file'}`
          : url;
      li.appendChild(a);
      if (visibility === 'private') {
          li.append(' (private, available only on this device)');
      }
      uploadListBox.appendChild(li);
  }
  
  function addError(name, text) {
      const li = document.createElement('li');
      li.className = 'log';
      li.textContent = `Error in ${name}: ${text}`;
      uploadListBox.appendChild(li);
  }
</script>
